name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PGRX_VERSION: "0.12.9"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: clippy + test (pg${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17]
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg }} + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} \
            build-essential clang libclang-dev pkg-config libssl-dev libreadline-dev zlib1g-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: pg${{ matrix.pg }}

      # Compiles cargo-pgrx (~1-2 min, cached by rust-cache on subsequent runs).
      - name: Install cargo-pgrx ${{ env.PGRX_VERSION }}
        run: cargo install --locked cargo-pgrx --version ${{ env.PGRX_VERSION }}

      # Reuse the apt-installed Postgres instead of compiling one (fast).
      - name: pgrx init (system Postgres)
        run: cargo pgrx init --pg${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      # `cargo pgrx test` installs the extension into Postgres's pkglib/share dirs,
      # which are root-owned for the apt package. Give the runner user write access
      # so the install step doesn't hit "Permission denied".
      - name: Make Postgres extension dirs writable
        run: |
          PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          sudo chown -R "$(id -un)" "$($PG_CONFIG --pkglibdir)" "$($PG_CONFIG --sharedir)/extension"

      # `cargo pgrx test` puts its ephemeral test cluster in target/test-pgdata,
      # which rust-cache saves and restores as part of target/. A restored data
      # dir makes the pgrx test harness skip initdb and then fail to start
      # Postgres ("could not access .../postgresql.conf: No such file"), which
      # takes down every SQL test. Delete any restored copy so each run initdb's
      # a fresh cluster.
      - name: Clear cached pgrx test cluster
        run: rm -rf target/test-pgdata

      - name: Clippy
        run: cargo clippy --no-default-features --features pg${{ matrix.pg }} -- -D warnings

      - name: Test
        run: cargo pgrx test pg${{ matrix.pg }}
