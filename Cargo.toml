[package]
name = "brindle"
version = "0.0.1"
edition = "2021"
description = "Filter-aware, hybrid vector search for PostgreSQL"
license = "PostgreSQL"
repository = "https://github.com/your-username/brindle"
readme = "README.md"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg17"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
# Enables the pgrx integration-test harness (`cargo pgrx test`).
pg_test = []

[dependencies]
pgrx = "=0.12.9"

[dev-dependencies]
pgrx-tests = "=0.12.9"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
