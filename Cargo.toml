# The root package is the pgrx extension; `cargo pgrx` and the release workflow
# run from here. The algorithms it wraps live in the Postgres-free core crate.
[workspace]
members = ["crates/brindle-core"]

# One version for both crates: the core has no life outside this extension.
[workspace.package]
version = "0.0.1"
edition = "2021"
license = "PostgreSQL"
repository = "https://github.com/adriendinzey/Brindle"

[package]
name = "brindle"
description = "Filter-aware, hybrid vector search for PostgreSQL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
# pgrx 0.12.9 emits an internal `cfg(pgrx_embed)` that newer rustc's check-cfg
# doesn't know about; declare it so `clippy -D warnings` stays clean. Revisit on a
# pgrx upgrade.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pgrx_embed)'] }

[lib]
crate-type = ["cdylib", "lib"]

# Required by pgrx for SQL generation (`cargo pgrx schema`/`install`/`test`).
[[bin]]
name = "pgrx_embed_brindle"
path = "./src/bin/pgrx_embed.rs"

[features]
default = ["pg17"]
# pg12/pg13 are declared because pgrx's pg_module_magic! references them; they're
# not in the CI matrix (supported majors are pg14-pg17).
pg12 = ["pgrx/pg12", "pgrx-tests/pg12"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
# Enables the pgrx integration-test harness (`cargo pgrx test`).
pg_test = []

[dependencies]
brindle-core = { path = "crates/brindle-core" }
pgrx = "=0.12.9"

[dev-dependencies]
pgrx-tests = "=0.12.9"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
